name: .NET CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # ФИКС: Ставим 10, как в твоем проекте

    - name: Restore dependencies
      run: dotnet restore

    - name: Build and Run Static Analysis
      run: dotnet build --no-restore -c Release -warnaserror

    - name: Run Unit Tests & Collect Coverage
      # Добавляем --settings, чтобы сработал твой файл исключений мусора
      run: dotnet test Backend.UnitTests/Backend.UnitTests.csproj -c Release --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./TestResults --logger "trx;LogFileName=unit-results.trx"
      
    - name: Generate Code Coverage Summary Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: 'TestResults/**/coverage.cobertura.xml'
        badge: true
        format: markdown
        output: both
        thresholds: '50 70'

    - name: Add Coverage Summary to Workflow
      run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
      
    - name: Run Integration / BDD Tests (Optional)
      # Запускаем BDD. Если упадут - идем дальше
      run: dotnet test --no-build -c Release --verbosity normal --filter FullyQualifiedName~BDDTests --logger "trx;LogFileName=bdd-results.trx" --results-directory ./TestResults
      continue-on-error: true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ./TestResults # Загружаем всю папку с результатами (trx и coverage)
        retention-days: 1

  generate_allure_report:
    needs: build_and_test
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Checkout gh-pages
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: gh-pages
      continue-on-error: true

    - name: Download Test Results
      uses: actions/download-artifact@v4
      with:
        name: test-results
        path: all-results

    - name: Install Allure CLI
      run: npm install -g allure-commandline --save-dev

    - name: Generate Allure Report
      # Магия: Allure умеет конвертировать trx, если указать правильный тип входа
      run: |
        allure generate all-results --clean -o allure-report
        
    - name: Deploy Allure Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-report